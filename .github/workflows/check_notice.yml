name: Check Notices and U-STEP Programs

on:
  schedule:
    # 30분마다 자동 실행 (UTC 기준)
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # JSON 상태 저장 파일 커밋/푸시 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install playwright requests; fi
          playwright install --with-deps chromium

      - name: Run Crawlers
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_GENERAL: ${{ secrets.DISCORD_WEBHOOK_GENERAL }}
          DISCORD_WEBHOOK_CHALLENGE: ${{ secrets.DISCORD_WEBHOOK_CHALLENGE }}
          DISCORD_WEBHOOK_MUNSU: ${{ secrets.DISCORD_WEBHOOK_MUNSU }}
        run: |
          python check_notice.py
          python check_ustep.py
          python check_munsu.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_notice.json latest_ustep.json latest_munsu.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update notices, U-STEP and Munsu state [skip ci]" && git push)