name: Check Notices, U-STEP Programs, and Academic Schedule

on:
  schedule:
    # 30분마다 정기 실행 (UTC 기준)
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # JSON 상태 파일 git commit & push 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt 파일이 있다면 읽고, 없으면 아래 패키지 설치
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          else 
            pip install playwright requests beautifulsoup4 firebase-admin
          fi
          playwright install --with-deps chromium

      - name: Run Crawlers
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_GENERAL: ${{ secrets.DISCORD_WEBHOOK_GENERAL }}
          DISCORD_WEBHOOK_CHALLENGE: ${{ secrets.DISCORD_WEBHOOK_CHALLENGE }}
          DISCORD_WEBHOOK_MUNSU: ${{ secrets.DISCORD_WEBHOOK_MUNSU }}
          DISCORD_WEBHOOK_ICT: ${{ secrets.DISCORD_WEBHOOK_ICT }}
          DISCORD_WEBHOOK_SCHEDULE_DAILY: ${{ secrets.DISCORD_WEBHOOK_SCHEDULE_DAILY }}
          DISCORD_WEBHOOK_SCHEDULE_UPDATE: ${{ secrets.DISCORD_WEBHOOK_SCHEDULE_UPDATE }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          python check_notice.py
          python check_ustep.py
          python check_munsu.py
          python check_ict.py
          python check_schedule.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # JSON 상태 파일들을 커밋 (ICT는 이제 Firestore를 쓰므로 빠져도 되지만, 
          # 다른 스크립트들이 아직 JSON을 쓰므로 그대로 둡니다.)
          git add latest_notice.json latest_ustep.json latest_munsu.json latest_schedule.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update crawler state [skip ci]" && git push)