name: Check Notices, U-STEP Programs, and Academic Schedule

on:
  schedule:
    # 3시간마다 실행 (0시, 3시, 6시, 9시, 12시, 15시, 18시, 21시)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          else 
            pip install playwright requests beautifulsoup4 firebase-admin
          fi
          playwright install --with-deps chromium

      - name: Run Crawlers
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_GENERAL: ${{ secrets.DISCORD_WEBHOOK_GENERAL }}
          DISCORD_WEBHOOK_CHALLENGE: ${{ secrets.DISCORD_WEBHOOK_CHALLENGE }}
          DISCORD_WEBHOOK_MUNSU: ${{ secrets.DISCORD_WEBHOOK_MUNSU }}
          DISCORD_WEBHOOK_ICT: ${{ secrets.DISCORD_WEBHOOK_ICT }}
          DISCORD_WEBHOOK_SCHEDULE_DAILY: ${{ secrets.DISCORD_WEBHOOK_SCHEDULE_DAILY }}
          DISCORD_WEBHOOK_SCHEDULE_UPDATE: ${{ secrets.DISCORD_WEBHOOK_SCHEDULE_UPDATE }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          python check_notice.py
          sleep 5
          python check_ustep.py
          sleep 5
          python check_munsu.py
          sleep 5
          python check_ict.py
          sleep 5
          python check_schedule.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_notice.json latest_ustep.json latest_munsu.json latest_schedule.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update crawler state [skip ci]" && git push)
